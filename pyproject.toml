[project]
name = "google-calender-mcp-agent"
version = "0.1.0"
description = "Agentic calendar assistant using tool-calling to manage Google Calendar events"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calendar_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
